services:
  postgres:
    image: 'postgres:18.4-alpine'
    environment:
      - 'POSTGRES_DB=app'
      - 'POSTGRES_PASSWORD=app'
      - 'POSTGRES_USER=app'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build:
      context: ./backend
      # Provenance metadata is timestamped, which would produce a new image (and a dangling old one) on every rebuild.
      provenance: false
    image: 'homework-backend'
    # Rebuild on every `docker compose up`, so the container always runs the jar Maven built last.
    pull_policy: build
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app'
      - 'SPRING_DATASOURCE_USERNAME=app'
      - 'SPRING_DATASOURCE_PASSWORD=app'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
